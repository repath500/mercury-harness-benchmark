benchmark: mercury-harness-v2
dataset:
  name: featbench
  revision: v1.0
  task_list: tasks/mercury-v2.txt
environment:
  provider: e2b
  fresh_sandbox_per_trial: true
  containers: 1
model:
  provider: openrouter
  id: z-ai/glm-5.3-flash
  reasoning: harness-default
harnesses:
  - pi
  - oh-my-pi
  - claude-code
  - codex
  - deepseek-harness
  - critique-code
  - opencode
runs_per_task: 1
agent_timeout_minutes: 60
human_intervention: false
concurrency: 2
telemetry:
  additions_vs_v1:
    - first_model_request_ms
    - first_tool_call_ms
    - active_agent_ms
    - tool_calls_per_model_request
    - test_runs
    - context_growth
    - output_claims
    - verifier_suite_gap
    - artifact_bytes
    - provider_ledger_completeness
